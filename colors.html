<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Colors</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: white;
    width: 100%;
    overflow-x: hidden;
}

.page {
    position: relative;
    width: 100%;
    max-width: 1455px;
    margin: auto;
}

.page img {
    width: 100%;
    height: auto;
    display: block;
}


/* مناطق الضغط */

.color-button {

    position: absolute;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    z-index: 10;

    -webkit-tap-highlight-color: transparent;

    transition: transform 0.1s;

}


/* تأثير عند الضغط */

.color-button:active {

    transform: scale(0.96);

}


/* زر إعادة الصوت */

.title-button {

    position: fixed;

    bottom: 15px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    border: none;

    background: #8bea00;

    color: white;

    font-size: 18px;

    font-weight: bold;

    padding: 12px 25px;

    border-radius: 30px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.25);

}

</style>

</head>


<body>


<div class="page">

<img src="colors.png" alt="Colors">


<!-- RED -->

<button
class="color-button"
style="
left: 15%;
top: 20%;
width: 34%;
height: 15%;
"
onclick="playColor('red')">
</button>


<!-- YELLOW -->

<button
class="color-button"
style="
left: 51%;
top: 20%;
width: 34%;
height: 15%;
"
onclick="playColor('yellow')">
</button>


<!-- GREEN -->

<button
class="color-button"
style="
left: 15%;
top: 37%;
width: 34%;
height: 15%;
"
onclick="playColor('green')">
</button>


<!-- PINK -->

<button
class="color-button"
style="
left: 51%;
top: 37%;
width: 34%;
height: 15%;
"
onclick="playColor('pink')">
</button>


<!-- ORANGE -->

<button
class="color-button"
style="
left: 15%;
top: 55%;
width: 34%;
height: 15%;
"
onclick="playColor('orange')">
</button>


<!-- PURPLE -->

<button
class="color-button"
style="
left: 51%;
top: 55%;
width: 34%;
height: 15%;
"
onclick="playColor('purple')">
</button>


<!-- BLUE -->

<button
class="color-button"
style="
left: 15%;
top: 73%;
width: 34%;
height: 15%;
"
onclick="playColor('blue')">
</button>


<!-- BROWN -->

<button
class="color-button"
style="
left: 51%;
top: 73%;
width: 34%;
height: 15%;
"
onclick="playColor('brown')">
</button>

</div>


<script>

let currentAudio = null;


function playColor(color) {

    /* إيقاف الصوت السابق */

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

    }


    /* تشغيل صوت اللون */

    currentAudio = new Audio(color + ".mp3");

    currentAudio.play().catch(function(error) {

        console.log("Audio error:", error);

    });

}

</script>


</body>

</html>
