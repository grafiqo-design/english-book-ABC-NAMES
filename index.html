<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Letters</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        background: white;
        font-family: Arial, sans-serif;
    }

    .page {
        position: relative;
        width: 100%;
        max-width: 1453px;
        margin: 0 auto;
        overflow: hidden;
    }

    .page img {
        display: block;
        width: 100%;
        height: auto;
    }

    /*
       مناطق النقر
       كل منطقة فوق الحرف الصغير داخل البيضة
    */

    .letter-button {
        position: absolute;
        cursor: pointer;
        z-index: 10;

        /* نخلي المنطقة شفافة */
        background: transparent;
        border: none;
        padding: 0;
    }

    /* عند الضغط يظهر تأثير بسيط */
    .letter-button:active {
        transform: scale(0.94);
    }


    /* =========================
       الصفحة الأولى A - M
       ========================= */

    /* A */
    .a {
        left: 17.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    /* B */
    .b {
        left: 36.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    /* C */
    .c {
        left: 55.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    /* D */
    .d {
        left: 74.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    /* E */
    .e {
        left: 8.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    /* F */
    .f {
        left: 27.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    /* G */
    .g {
        left: 46.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    /* H */
    .h {
        left: 65.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    /* I */
    .i {
        left: 84.5%;
        top: 55%;
        width: 5%;
        height: 8%;
    }

    /* J */
    .j {
        left: 17.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    /* K */
    .k {
        left: 36.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    /* L */
    .l {
        left: 55.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    /* M */
    .m {
        left: 74.5%;
        top: 85%;
        width: 6%;
        height: 8%;
    }


    /* =========================
       الصفحة الثانية N - Z
       ========================= */

    .n {
        left: 17.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    .o {
        left: 36.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    .p {
        left: 55.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    .q {
        left: 74.5%;
        top: 24%;
        width: 5.5%;
        height: 8%;
    }

    .r {
        left: 8.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    .s {
        left: 27.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    .t {
        left: 46.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    .u {
        left: 65.5%;
        top: 55%;
        width: 6%;
        height: 8%;
    }

    .v {
        left: 84.5%;
        top: 55%;
        width: 5%;
        height: 8%;
    }

    .w {
        left: 17.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    .x {
        left: 36.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    .y {
        left: 55.5%;
        top: 85%;
        width: 5.5%;
        height: 8%;
    }

    .z {
        left: 74.5%;
        top: 85%;
        width: 6%;
        height: 8%;
    }

</style>
</head>

<body>


<!-- =====================================
     الصفحة الأولى A - M
     ===================================== -->

<div class="page">

    <img src="alphabet-1.png" alt="ABC A to M">

    <button class="letter-button a" onclick="playLetter('A')"></button>
    <button class="letter-button b" onclick="playLetter('B')"></button>
    <button class="letter-button c" onclick="playLetter('C')"></button>
    <button class="letter-button d" onclick="playLetter('D')"></button>

    <button class="letter-button e" onclick="playLetter('E')"></button>
    <button class="letter-button f" onclick="playLetter('F')"></button>
    <button class="letter-button g" onclick="playLetter('G')"></button>
    <button class="letter-button h" onclick="playLetter('H')"></button>
    <button class="letter-button i" onclick="playLetter('I')"></button>

    <button class="letter-button j" onclick="playLetter('J')"></button>
    <button class="letter-button k" onclick="playLetter('K')"></button>
    <button class="letter-button l" onclick="playLetter('L')"></button>
    <button class="letter-button m" onclick="playLetter('M')"></button>

</div>


<!-- =====================================
     الصفحة الثانية N - Z
     ===================================== -->

<div class="page">

    <img src="alphabet-2.png" alt="ABC N to Z">

    <button class="letter-button n" onclick="playLetter('N')"></button>
    <button class="letter-button o" onclick="playLetter('O')"></button>
    <button class="letter-button p" onclick="playLetter('P')"></button>
    <button class="letter-button q" onclick="playLetter('Q')"></button>

    <button class="letter-button r" onclick="playLetter('R')"></button>
    <button class="letter-button s" onclick="playLetter('S')"></button>
    <button class="letter-button t" onclick="playLetter('T')"></button>
    <button class="letter-button u" onclick="playLetter('U')"></button>
    <button class="letter-button v" onclick="playLetter('V')"></button>

    <button class="letter-button w" onclick="playLetter('W')"></button>
    <button class="letter-button x" onclick="playLetter('X')"></button>
    <button class="letter-button y" onclick="playLetter('Y')"></button>
    <button class="letter-button z" onclick="playLetter('Z')"></button>

</div>


<script>

let currentAudio = null;

function playLetter(letter) {

    /* إيقاف الصوت السابق */
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    /* تشغيل صوت الحرف */
    currentAudio = new Audio(letter + ".mp3");

    currentAudio.play().catch(function(error) {
        console.log("Audio error:", error);
    });
}

</script>

</body>
</html>
