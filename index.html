<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My English Alphabet</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow-x: hidden;
}

.book-page {
  position: relative;
  width: 100%;
  max-width: 1455px;
  margin: auto;
  aspect-ratio: 1455 / 1025;
}

.book-page img {
  width: 100%;
  height: 100%;
  display: block;
}

/* مناطق الضغط على الحروف */

.letter-button {
  position: absolute;

  width: 9%;
  aspect-ratio: 1 / 1;

  border: none;
  background: transparent;

  border-radius: 50%;

  cursor: pointer;

  padding: 0;

  z-index: 10;

  -webkit-tap-highlight-color: transparent;
}

/* تأثير بسيط عند الضغط */

.letter-button:active {
  background: rgba(255, 214, 0, 0.25);
  transform: scale(0.92);
}


/* الصفحة الثانية */

#page2 {
  display: none;
}


/* زر التالي والعودة */

.next-button,
.back-button {

  position: fixed;

  bottom: 15px;

  z-index: 50;

  border: none;

  background: #8bea00;

  color: white;

  font-size: 22px;

  font-weight: bold;

  padding: 12px 22px;

  border-radius: 30px;

  box-shadow: 0 3px 10px rgba(0,0,0,0.25);

  cursor: pointer;
}

.next-button {
  right: 15px;
}

.back-button {
  left: 15px;
}

.next-button:active,
.back-button:active {

  transform: scale(0.9);

}

</style>

</head>


<body>


<!-- ================================= -->
<!-- الصفحة الأولى A إلى M -->
<!-- ================================= -->

<div class="book-page" id="page1">

<img src="page1.png" alt="English Alphabet A to M">


<!-- A -->

<button
class="letter-button"
style="left:7%; top:3%;"
onclick="playLetter('A')">
</button>


<!-- B -->

class="letter-button"
style="left:27%; top:3%;"
onclick="playLetter('B')">

onclick="playLetter('D')">

</button>


<!-- F -->

onclick="playLetter('F')">
</button>


<!-- G -->

<!-- J -->

onclick="playLetter('L')">

<!-- M -->

<button
class="letter-button"
style="left:68%; top:68%;"
onclick="playLetter('M')">
</button>


</div>



<!-- ================================= -->
<!-- الصفحة الثانية N إلى Z -->
<!-- ================================= -->

<div class="book-page" id="page2">

<img src="page2.png" alt="English Alphabet N to Z">

<!-- أزرار التنقل -->


<button
class="next-button"
onclick="showPage2()">

Next ➜

</button>


<button
class="back-button"
onclick="showPage1()"
style="display:none;">

← Back

</button>



<script>

/* ========================================= */
/* تشغيل ملف الصوت الخاص بالحرف */
/* ========================================= */

let currentAudio = null;


function playLetter(letter) {

  // إيقاف الصوت السابق

  if (currentAudio) {

    currentAudio.pause();

    currentAudio.currentTime = 0;

  }


  // اختيار ملف الصوت

  currentAudio = new Audio(letter + ".mp3");


  // تشغيل الصوت

  currentAudio.play().catch(function(error) {

    console.log("Audio could not play:", error);

  });

}



/* ========================================= */
/* الانتقال للصفحة الثانية */
/* ========================================= */

function showPage2() {

  document.getElementById("page1").style.display = "none";

  document.getElementById("page2").style.display = "block";

  document.querySelector(".next-button").style.display = "none";

  document.querySelector(".back-button").style.display = "block";

  window.scrollTo(0, 0);

}



/* ========================================= */
/* العودة للصفحة الأولى */
/* ========================================= */

function showPage1() {

  document.getElementById("page2").style.display = "none";

  document.getElementById("page1").style.display = "block";

  document.querySelector(".back-button").style.display = "none";

  document.querySelector(".next-button").style.display = "block";

  window.scrollTo(0, 0);

}

</script>
