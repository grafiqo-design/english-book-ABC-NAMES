<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My English Alphabet</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow-x: hidden;
}

.book-page {
  position: relative;
  width: 100%;
  max-width: 1455px;
  margin: auto;
  aspect-ratio: 1455 / 1025;
}

.book-page img {
  width: 100%;
  height: 100%;
  display: block;
}

/* مناطق الضغط على الحروف */
.letter-button {
  position: absolute;
  width: 9%;
  aspect-ratio: 1 / 1;
  border: none;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  padding: 0;
  z-index: 10;
}

/* عند الضغط يظهر تأثير بسيط */
.letter-button:active {
  background: rgba(255, 214, 0, 0.25);
  transform: scale(0.92);
}

/* الصفحة الثانية مخفية بالبداية */
#page2 {
  display: none;
}

/* زر الانتقال */
.next-button,
.back-button {
  position: fixed;
  bottom: 15px;
  z-index: 50;
  border: none;
  background: #8bea00;
  color: white;
  font-size: 22px;
  font-weight: bold;
  padding: 12px 22px;
  border-radius: 30px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  cursor: pointer;
}

.next-button {
  right: 15px;
}

.back-button {
  left: 15px;
}

.next-button:active,
.back-button:active {
  transform: scale(0.9);
}
</style>
</head>

<body>

<!-- الصفحة الأولى A-M -->
<div class="book-page" id="page1">

  <img src="page1.png" alt="English Alphabet A to M">

  <!-- A -->
  <button class="letter-button" style="left:7%; top:3%;"
          onclick="speak('A')"></button>

  <!-- B -->
  <button class="letter-button" style="left:27%; top:3%;"
          onclick="speak('B')"></button>

  <!-- C -->
  <button class="letter-button" style="left:45%; top:3%;"
          onclick="speak('C')"></button>

  <!-- D -->
  <button class="letter-button" style="left:71%; top:3%;"
          onclick="speak('D')"></button>

  <!-- E -->
  <button class="letter-button" style="left:0%; top:27%;"
          onclick="speak('E')"></button>

  <!-- F -->
  <button class="letter-button" style="left:18%; top:28%;"
          onclick="speak('F')"></button>

  <!-- G -->
  <button class="letter-button" style="left:36%; top:27%;"
          onclick="speak('G')"></button>

  <!-- H -->
  <button class="letter-button" style="left:55%; top:27%;"
          onclick="speak('H')"></button>

  <!-- I -->
  <button class="letter-button" style="left:77%; top:26%;"
          onclick="speak('I')"></button>

  <!-- J -->
  <button class="letter-button" style="left:5%; top:69%;"
          onclick="speak('J')"></button>

  <!-- K -->
  <button class="letter-button" style="left:25%; top:69%;"
          onclick="speak('K')"></button>

  <!-- L -->
  <button class="letter-button" style="left:45%; top:69%;"
          onclick="speak('L')"></button>

  <!-- M -->
  <button class="letter-button" style="left:68%; top:68%;"
          onclick="speak('M')"></button>

</div>


<!-- الصفحة الثانية N-Z -->
<div class="book-page" id="page2">

  <img src="page2.png" alt="English Alphabet N to Z">

  <!-- N -->
  <button class="letter-button" style="left:7%; top:3%;"
          onclick="speak('N')"></button>

  <!-- O -->
  <button class="letter-button" style="left:27%; top:3%;"
          onclick="speak('O')"></button>

  <!-- P -->
  <button class="letter-button" style="left:45%; top:3%;"
          onclick="speak('P')"></button>

  <!-- Q -->
  <button class="letter-button" style="left:71%; top:3%;"
          onclick="speak('Q')"></button>

  <!-- R -->
  <button class="letter-button" style="left:0%; top:27%;"
          onclick="speak('R')"></button>

  <!-- S -->
  <button class="letter-button" style="left:18%; top:28%;"
          onclick="speak('S')"></button>

  <!-- T -->
  <button class="letter-button" style="left:36%; top:27%;"
          onclick="speak('T')"></button>

  <!-- U -->
  <button class="letter-button" style="left:55%; top:27%;"
          onclick="speak('U')"></button>

  <!-- V -->
  <button class="letter-button" style="left:77%; top:26%;"
          onclick="speak('V')"></button>

  <!-- W -->
  <button class="letter-button" style="left:5%; top:69%;"
          onclick="speak('W')"></button>

  <!-- X -->
  <button class="letter-button" style="left:25%; top:69%;"
          onclick="speak('X')"></button>

  <!-- Y -->
  <button class="letter-button" style="left:45%; top:69%;"
          onclick="speak('Y')"></button>

  <!-- Z -->
  <button class="letter-button" style="left:68%; top:68%;"
          onclick="speak('Z')"></button>

</div>


<!-- أزرار التنقل -->
<button class="next-button" onclick="showPage2()">
  Next ➜
</button>

<button class="back-button" onclick="showPage1()" style="display:none;">
  ← Back
</button>


<script>

function speak(letter) {

  // إيقاف أي صوت سابق
  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(letter);

  // نطق إنجليزي
  voice.lang = "en-US";

  // سرعة مناسبة للأطفال
  voice.rate = 0.75;

  voice.pitch = 1;

  window.speechSynthesis.speak(voice);
}


function showPage2() {

  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "block";

  document.querySelector(".next-button").style.display = "none";
  document.querySelector(".back-button").style.display = "block";

  window.scrollTo(0, 0);
}


function showPage1() {

  document.getElementById("page2").style.display = "none";
  document.getElementById("page1").style.display = "block";

  document.querySelector(".back-button").style.display = "none";
  document.querySelector(".next-button").style.display = "block";

  window.scrollTo(0, 0);
}

</script>

</body>
</html>
