<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numbers 1 to 10</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: white;
    width: 100%;
    overflow-x: hidden;
}

.page {
    position: relative;
    width: 100%;
    max-width: 1455px;
    margin: auto;
}

.page img {
    width: 100%;
    height: auto;
    display: block;
}


/* مناطق الضغط على الأرقام */

.number-button {
    position: absolute;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    z-index: 10;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
}


/* تأثير بسيط عند الضغط */

.number-button:active {
    background: rgba(255, 220, 0, 0.25);
    transform: scale(0.93);
}


/* الصفحة الثانية مخفية في البداية */

#page2 {
    display: none;
}


/* أزرار التنقل */

.next-button,
.back-button {

    position: fixed;

    bottom: 15px;

    z-index: 100;

    border: none;

    background: #8bea00;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding: 12px 22px;

    border-radius: 30px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.25);

    cursor: pointer;
}

.next-button {
    right: 15px;
}

.back-button {
    left: 15px;
}

.next-button:active,
.back-button:active {
    transform: scale(0.9);
}

</style>
</head>


<body>


<!-- ================================================= -->
<!-- الصفحة الأولى : الأرقام 1 إلى 5 -->
<!-- ================================================= -->

<div class="page" id="page1">

<img src="numbers1.png" alt="Numbers 1 to 5">


<!-- 1 -->

<button
class="number-button"
style="
left: 5%;
top: 6%;
width: 14%;
height: 25%;
"
onclick="playNumber(1)">
</button>


<!-- 2 -->

<button
class="number-button"
style="
left: 48%;
top: 5%;
width: 16%;
height: 20%;
"
onclick="playNumber(2)">
</button>


<!-- 3 -->

<button
class="number-button"
style="
left: 4%;
top: 42%;
width: 16%;
height: 25%;
"
onclick="playNumber(3)">
</button>


<!-- 4 -->

<button
class="number-button"
style="
left: 48%;
top: 42%;
width: 17%;
height: 22%;
"
onclick="playNumber(4)">
</button>


<!-- 5 -->

<button
class="number-button"
style="
left: 27%;
top: 71%;
width: 17%;
height: 25%;
"
onclick="playNumber(5)">
</button>

</div>



<!-- ================================================= -->
<!-- الصفحة الثانية : الأرقام 6 إلى 10 -->
<!-- ================================================= -->

<div class="page" id="page2">

<img src="numbers2.png" alt="Numbers 6 to 10">


<!-- 6 -->

<button
class="number-button"
style="
left: 3%;
top: 6%;
width: 17%;
height: 25%;
"
onclick="playNumber(6)">
</button>


<!-- 7 -->

<button
class="number-button"
style="
left: 49%;
top: 6%;
width: 17%;
height: 20%;
"
onclick="playNumber(7)">
</button>


<!-- 8 -->

<button
class="number-button"
style="
left: 4%;
top: 42%;
width: 17%;
height: 25%;
"
onclick="playNumber(8)">
</button>


<!-- 9 -->

<button
class="number-button"
style="
left: 49%;
top: 42%;
width: 17%;
height: 24%;
"
onclick="playNumber(9)">
</button>


<!-- 10 -->

<button
class="number-button"
style="
left: 25%;
top: 71%;
width: 23%;
height: 25%;
"
onclick="playNumber(10)">
</button>

</div>



<!-- ================================================= -->
<!-- أزرار الانتقال -->
<!-- ================================================= -->

<button
class="next-button"
id="nextButton"
onclick="showPage2()">
Next ➜
</button>


<button
class="back-button"
id="backButton"
onclick="showPage1()"
style="display:none;">
← Back
</button>



<script>


/* الصوت الحالي */

let currentAudio = null;



/* تشغيل الرقم */

function playNumber(number) {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

    }

    currentAudio = new Audio(number + ".mp3");

    currentAudio.play().catch(function(error) {

        console.log("Audio error:", error);

    });

}



/* الانتقال للصفحة الثانية */

function showPage2() {

    document.getElementById("page1").style.display = "none";

    document.getElementById("page2").style.display = "block";

    document.getElementById("nextButton").style.display = "none";

    document.getElementById("backButton").style.display = "block";

    window.scrollTo(0, 0);

}



/* الرجوع للصفحة الأولى */

function showPage1() {

    document.getElementById("page2").style.display = "none";

    document.getElementById("page1").style.display = "block";

    document.getElementById("nextButton").style.display = "block";

    document.getElementById("backButton").style.display = "none";

    window.scrollTo(0, 0);

}

</script>


</body>
</html>
